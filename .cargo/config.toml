# Android 15+ can run with 16 KB memory pages; the app's native library must
# have its segments aligned to that or Android warns (and may refuse it).
[target.aarch64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]

[target.x86_64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]
