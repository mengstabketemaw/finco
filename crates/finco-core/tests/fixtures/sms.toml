# One case per real SMS format, copied from a real inbox (Sep–Nov 2026) with
# names, account numbers, phone numbers and references replaced. Wording,
# punctuation, spacing and line breaks are kept exactly, typos included.
#
# 0911223344 / 251911223344 stands in for the owner's own number.
# Money is written as in the message; occurred_at defaults to received_at.

# ── telebirr (127) ──────────────────────────────────────────────────────────

[[case]]
name = "telebirr transfer to a person"
sender = "127"
received_at = "2026-10-02T19:35:02+03:00"
body = '''Dear Abebe
You have transferred ETB 15.00 to Kebede Alemu (2519****8470) on 02/10/2026 19:34:59. Your transaction number is DJ21AAAAA1. The service fee is  ETB 0.87 and  15% VAT on the service fee is ETB 0.13. Your current E-Money Account  balance is ETB 2,791.06. To download your payment information please click this link: https://transactioninfo.ethiotelecom.et/receipt/DJ21AAAAA1.

Thank you for using telebirr
Ethio telecom'''
[case.expect]
outcome = "parsed"
rule_id = "telebirr.transfer_out.person"
kind = "transfer_out"
amount = "15.00"
fee = "1.00"
balance = "2,791.06"
counterparty = "Kebede Alemu"
counterparty_account = "****8470"
reference = "DJ21AAAAA1"
